{% extends "base.html" %}{% block title %}Login | SecureGate{% endblock %}{% block content %}
<section class="card auth-card"><div class="shield">🛡</div><h1>Welcome back</h1><p class="muted">Sign in to your SecureGate account.</p>
<form method="post" class="stack"><label>Username<input name="username" autocomplete="username" required maxlength="80"></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary">Login securely</button></form>
<p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p></section>{% endblock %}
